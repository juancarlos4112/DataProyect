services:
  - type: web
    name: ordenes-rack
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /salud
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /data
      - key: FORCE_HTTPS
        value: "1"
      - key: TZ
        value: America/Santiago
      - key: COMPANY_NAME
        value: Mi Empresa
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: datos
      mountPath: /data
      sizeGB: 1
